<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eco-Shop | Project Gallery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="script.js"></script>

  <body>
    <header class="nav-shell">
      <nav class="navbar" aria-label="Primary">
        <a class="brand" href="index.html" aria-label="Chamath Herath home">CH</a>
        <div class="nav-links">
          <a href="index.html#projects" class="nav-link active">Back to Projects</a>

        <div class="nav-actions">
          <button class="theme-toggle magnetic" id="themeToggle" type="button" aria-label="Toggle theme">
            <span class="theme-icon">◐</span>
          </button>
        </div>
      </nav>
    </header>

    <main class="page-gallery section">

      <div class="gallery-grid">

        <figure class="gallery-item">

        </figure>
        <figure class="gallery-item">
          <img src="assets/professional-skills/placeholder-3.svg" alt="Eco-Shop project activity 3" />
          <figcaption>Project Preview 3</figcaption>
        </figure>
        <figure class="gallery-item">
          <img src="assets/professional-skills/placeholder-4.svg" alt="Eco-Shop project activity 4" />
          <figcaption>Project Preview 4</figcaption>
        </figure>
      </div>
    </main>
